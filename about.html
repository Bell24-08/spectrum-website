    </div>

  <section class="section" id="worldwide">
    <div class="wrap world">
      <div class="reveal">

          <p data-i18n="world.body"></p>
        </div>
        <p class="eyebrow" style="margin-top:36px" data-i18n="world.ex">For example</p>
        <div class="example" style="margin-top:12px">
          <span class="pin gold"><span data-i18n="world.from"></span><b data-i18n="world.de"></b></span>
          <span class="arrow" aria-hidden="true"></span>
          <span class="pin gold"><span data-i18n="world.to"></span><b data-i18n="world.br"></b></span>
        </div>
      </div>
      <div class="globe-box reveal"><canvas id="globe" aria-label="Globe with a search line from Germany to Brazil" role="img"></canvas></div>
    </div>
  </section>

  <section class="section" id="video">
    <div class="wrap">
      <div class="section-head center reveal" style="text-align:center">
        <p class="eyebrow" data-i18n="video.eyebrow">Company profile</p>
        <h2 data-i18n="video.title"></h2>
      </div>
      <div class="video-frame reveal">
        <video controls playsinline preload="metadata" poster="assets/img/video-poster.jpg">
          <source src="assets/video/spectrum-profile.mp4" type="video/mp4">
        </video>
      </div>
    </div>
